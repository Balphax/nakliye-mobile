name: Android APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Node.js 18 kur
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: NPM bağımlılıkları yükle
        working-directory: mobile
        run: npm install

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle izinleri ver
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: google-services.json oluştur
        working-directory: mobile/android/app
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      - name: APK derle
        working-directory: mobile/android
        run: cd android && ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: APK imzala
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: mobile/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: NakliyeBot-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Release oluştur
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mobile/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
